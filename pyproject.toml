[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otforge"
version = "0.1.0"
description = "World-class deterministic optimal transport: exact Kantorovich LP, entropic Sinkhorn, Wasserstein barycenters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = [
    "optimal-transport",
    "wasserstein",
    "sinkhorn",
    "earth-mover-distance",
    "barycenter",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
fast = ["scipy>=1.10"]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
otforge = "otforge.cli:main"

[tool.setuptools]
packages = [
    "otforge",
    "otforge.core",
    "otforge.data",
    "otforge.ot",
    "otforge.eval",
    "otforge.pipeline",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "B008",   # function calls in argument defaults are fine for dataclasses
    "RUF012", # mutable class defaults guarded by ClassVar conventions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF059"]
"examples/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
